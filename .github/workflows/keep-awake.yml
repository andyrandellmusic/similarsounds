name: Keep the site awake
# Render's free plan sleeps after 15 minutes without visits, so the next visitor waits up to a minute.
# A tiny visit every 10 minutes keeps it awake (24/7 fits inside the free plan's 750 hours a month).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://www.similarsounds.com/healthz || true
