# Adds the newest house releases to the catalogue every day, then commits it.
# Render redeploys automatically when the commit lands.
name: Daily catalogue update

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m scripts.seed --per-style 40
      - name: Commit updated catalogue
        run: |
          git config user.name "similarsounds-bot"
          git config user.email "similarsounds-bot@users.noreply.github.com"
          git add data/catalogue.db
          git diff --cached --quiet || git commit -m "Daily catalogue update $(date -u +%F)"
          git push
