# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: similarsounds
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      # Main address; every other address redirects here. Set in the Render dashboard: www.similarsounds.com
      - key: CANONICAL_HOST
        sync: false
      # Fewer glibc malloc arenas = much lower memory use with threads
      - key: MALLOC_ARENA_MAX
        value: "2"
