<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Check</title>
<style>
:root{--bg:#0b0b0f;--panel:#14141b;--line:#2a2a36;--text:#f2f2f5;--muted:#8d8da0;--accent:#c6ff3d}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
h1{margin:0 0 4px;font-size:26px}h2{margin:30px 0 8px;font-size:20px}p.lead{color:var(--muted);margin:0 0 18px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.t{font-weight:700}.a{color:var(--muted);font-size:13px}audio{width:100%;height:32px;margin:8px 0}
.pick{display:flex;flex-wrap:wrap;gap:8px}button{background:#1b1b24;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:600 14px Inter,sans-serif;cursor:pointer}
button.on{background:var(--accent);color:#0b0b0f;border-color:var(--accent)}#res{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
</style></head><body><div class="wrap">
<h1>Which label is right?</h1>
<p class="lead">Play each track and pick the sub-genre that fits best. The two labels are shuffled, so you won't know which is old or new. If neither fits, pick "Neither".</p>
<div id="labels"></div>
<h2>Is this house?</h2>
<p class="lead">These were flagged as sounding like another genre. Tell us if each one belongs on a house site.</p>
<div id="flags"></div>
<button id="done">Show my results</button><p id="res" hidden></p></div>
<script>
(async () => {
  const D = await (await fetch("labelcheck.json")).json();
  const P = JSON.parse(localStorage.getItem("ss_labels") || "{}");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const item = (o, key, opts) => `<div class="item"><div class="t">${esc(o.title)}</div><div class="a">${esc(o.artist)}</div>
    <audio controls preload="none" src="cache/${o.deezer_id}.mp3"></audio>
    <div class="pick">${opts.map(([v, label]) => `<button data-k="${key}" data-v="${v}" class="${P[key] === v ? "on" : ""}">${esc(label)}</button>`).join("")}</div></div>`;
  document.getElementById("labels").innerHTML = D.labels.map((o, i) => item(o, "l" + i, [...o.opts, ["neither", "Neither"]])).join("");
  document.getElementById("flags").innerHTML = D.flags.map((o, i) => item(o, "f" + i, [["house", "Yes, it's house"], ["not", "No, not house"]])).join("");
  document.addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    P[b.dataset.k] = b.dataset.v; localStorage.setItem("ss_labels", JSON.stringify(P));
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  });
  document.addEventListener("play", e => document.querySelectorAll("audio").forEach(a => a !== e.target && a.pause()), true);
  document.getElementById("done").onclick = () => {
    const c = { old: 0, new: 0, neither: 0 }, f = { house: 0, not: 0 };
    D.labels.forEach((o, i) => { const v = P["l" + i]; if (v) c[v]++; });
    D.flags.forEach((o, i) => { const v = P["f" + i]; if (v) f[v]++; });
    const r = document.getElementById("res"); r.hidden = false;
    r.textContent = `Labels: old ${c.old} · new ${c.new} · neither ${c.neither}\nFlagged tracks: house ${f.house} · not house ${f.not}`;
  };
})();
</script></body></html>
